# aioc compat probe for llama.cpp's llama-server.
#
# Drop this in `.github/workflows/aioc.yml` of a llama.cpp fork. It
# builds llama-server against the current PR, boots it on a tiny test
# model, waits for /health to come up, and probes the OpenAI surface.
# A FAIL row will fail the job; WARN rows (e.g. /v1/audio/* on a
# chat-only build) are reported but don't fail.
#
# Test model: ggml-org/test-model-stories260K (~1 MB, sub-2s startup).
# It generates gibberish but answers every endpoint shape correctly,
# which is exactly what aioc's Phase B signature checks need.

name: aioc compat
on:
  pull_request:
    paths:
      - 'tools/server/**'
      - '.github/workflows/aioc.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build llama-server
        run: |
          cmake -B build -DLLAMA_CURL=ON
          cmake --build build --target llama-server -j 4

      - name: Start llama-server
        run: |
          ./build/bin/llama-server \
            -hf ggml-org/test-model-stories260K \
            --port 8080 \
            --embeddings \
            >server.log 2>&1 &
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:8080/health >/dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to come up; last 50 lines of log:"
          tail -n 50 server.log
          exit 1

      - name: aioc probe — OpenAI compat
        uses: heiervang-technologies/am-i-openai-compatible@v0.2.0-pre1
        with:
          base-url: http://127.0.0.1:8080
          name: llama.cpp-${{ github.sha }}
          fail-on: FAIL
          # Pin the Python package to the same git ref so the action and
          # the catalog/probe code move together until the release lands
          # on PyPI. After that, drop this line to take the latest
          # published catalog.
          aioc-version: "git+https://github.com/heiervang-technologies/am-i-openai-compatible.git@v0.2.0-pre1"

      - name: aioc probe — HT compat (discovery)
        # Same server, HT-extension catalog. Under --profile ht, a 404
        # on an HT row is FAIL (the spec says: a server claiming
        # HT-compat is missing a required endpoint). For a fork doing
        # discovery — i.e. wiring up the probe before implementing any
        # HT endpoint — we use fail-on: none so the report renders in
        # the step summary without failing the build. Once the fork
        # ships its first HT endpoint, switch to fail-on: FAIL.
        #
        # Reminder on fail-on semantics: FAIL fails on FAIL only; WARN
        # fails on WARN-or-FAIL (stricter); none never fails. There is
        # no "downgrade FAIL to WARN" mode — pick discovery or strict.
        uses: heiervang-technologies/am-i-openai-compatible@v0.2.0-pre1
        with:
          base-url: http://127.0.0.1:8080
          name: llama.cpp-${{ github.sha }}-ht
          profile: ht
          fail-on: none
          report-path: aioc-report-ht.json
          aioc-version: "git+https://github.com/heiervang-technologies/am-i-openai-compatible.git@v0.2.0-pre1"

      - name: Stop llama-server
        if: always()
        run: pkill -f llama-server || true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "am-i-openai-compatible"
version = "0.4.1"
description = "Probe any HTTP server for OpenAI API compliance, with documented deviations across the OSS implementations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Heiervang Technologies" },
]
keywords = ["openai", "compatibility", "llm", "vllm", "llama.cpp", "ollama", "api-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=6.0",
]

[project.urls]
Homepage = "https://github.com/heiervang-technologies/am-i-openai-compatible"
Documentation = "https://heiervang-technologies.github.io/am-i-openai-compatible/"
Repository = "https://github.com/heiervang-technologies/am-i-openai-compatible"
Issues = "https://github.com/heiervang-technologies/am-i-openai-compatible/issues"

[project.scripts]
aioc = "am_i_openai_compatible.cli:main"
am-i-openai-compatible = "am_i_openai_compatible.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/am_i_openai_compatible"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long doc lines in spec catalog

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs for the same ref when a new commit lands.
  # Saves runner-minutes on rapid pushes; main runs (no PR head) get
  # the ref-name fallback so concurrent main pushes still queue.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, x64]
    strategy:
      # Don't abort sibling Python versions when one fails — seeing
      # the FULL matrix verdict on every run beats a fast no-signal
      # cancel.
      fail-fast: false
      matrix:
        # Adding 3.13 + 3.14 to surface forward-compat issues sooner.
        # Local dev runs 3.14 already; CI should catch any regressions
        # the same day a contributor on an older interpreter merges.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

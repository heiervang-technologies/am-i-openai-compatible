name: "am-i-openai-compatible"
description: "Probe an OpenAI-compatible HTTP server in CI and report per-endpoint pass/warn/fail/skip."
author: "Heiervang Technologies"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  base-url:
    description: "Root URL of the target server (e.g. http://127.0.0.1:8080)."
    required: true
  name:
    description: "Label for the report. Defaults to the host of base-url."
    required: false
    default: ""
  aioc-version:
    description: "Which build to install. Not on PyPI yet — accepts 'main' (latest commit on the default branch) or any pip-installable git spec, e.g. 'git+https://github.com/heiervang-technologies/am-i-openai-compatible.git@v0.3.1' to pin to a tag. Default 'main'."
    required: false
    default: "main"
  python-version:
    description: "Python version for the probe runtime."
    required: false
    default: "3.12"
  skip-phase-b:
    description: "If true, only run Phase A (existence checks). Faster smoke run."
    required: false
    default: "false"
  endpoints-filter:
    description: "Optional regex applied to endpoint paths. When set, only matching endpoints are probed. Use to skip the audio/image arm in fast-path PR runs."
    required: false
    default: ""
  profile:
    description: "Which catalog rows to probe: 'openai' (default; core/optional/ext) or 'ht' (adds HT-compat extensions per docs/spec/ht-compat.md and FAILs on 404 there)."
    required: false
    default: "openai"
  model:
    description: "Pin a specific model id for Phase B bodies (e.g. 'borealis-4b'). Default behavior picks the first model from /v1/models, which is arbitrary on router-mode servers. Falls back to kind-based selection for endpoints whose required kind the override can't serve."
    required: false
    default: ""
  openai-api-key:
    description: "Bearer token for WebSocket upgrades on /v1/realtime-style rows (ignored for REST endpoints). OSS servers usually accept the empty default; OpenAI-hosted targets require a real key. Use a GitHub Secret."
    required: false
    default: ""
  fail-on:
    description: "Threshold that fails the action: 'FAIL' (any FAIL row), 'WARN' (any WARN or FAIL), or 'none' (always succeed). Default 'FAIL'."
    required: false
    default: "FAIL"
  report-path:
    description: "Where to write the JSON report inside the workspace."
    required: false
    default: "aioc-report.json"
  upload-artifact:
    description: "If true, upload the report as a workflow artifact named 'aioc-report-<name>'."
    required: false
    default: "true"
  step-summary:
    description: "If true, append a per-endpoint markdown table to GITHUB_STEP_SUMMARY in catalog order."
    required: false
    default: "true"

outputs:
  report-path:
    description: "Path to the generated JSON report."
    value: ${{ steps.probe.outputs.report-path }}
  report-url:
    description: "URL of the uploaded artifact (empty if upload-artifact is false)."
    value: ${{ steps.upload.outputs.artifact-url }}
  pass-count:
    description: "Number of PASS events."
    value: ${{ steps.probe.outputs.pass-count }}
  warn-count:
    description: "Number of WARN events."
    value: ${{ steps.probe.outputs.warn-count }}
  fail-count:
    description: "Number of FAIL events."
    value: ${{ steps.probe.outputs.fail-count }}
  skip-count:
    description: "Number of SKIP events."
    value: ${{ steps.probe.outputs.skip-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install am-i-openai-compatible
      shell: bash
      env:
        AIOC_VERSION: ${{ inputs.aioc-version }}
      run: |
        python -m pip install --upgrade pip
        case "$AIOC_VERSION" in
          main)
            python -m pip install "git+https://github.com/heiervang-technologies/am-i-openai-compatible.git"
            ;;
          git+*)
            python -m pip install "$AIOC_VERSION"
            ;;
          v*|[0-9]*)
            # Bare tag/version like 'v0.3.1' or '0.3.1' — pin to the tag.
            python -m pip install "git+https://github.com/heiervang-technologies/am-i-openai-compatible.git@$AIOC_VERSION"
            ;;
          *)
            python -m pip install "$AIOC_VERSION"
            ;;
        esac
        aioc --help >/dev/null

    - name: Resolve probe label
      id: label
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        NAME_INPUT: ${{ inputs.name }}
      run: |
        if [ -n "$NAME_INPUT" ]; then
          echo "name=$NAME_INPUT" >>"$GITHUB_OUTPUT"
        else
          # Strip scheme, then everything after the first / or :
          host=$(printf '%s' "$BASE_URL" | sed -E 's#^https?://##; s#[:/].*##')
          echo "name=${host:-probe}" >>"$GITHUB_OUTPUT"
        fi

    - name: Run aioc probe
      id: probe
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        PROBE_NAME: ${{ steps.label.outputs.name }}
        REPORT_PATH: ${{ inputs.report-path }}
        SKIP_PHASE_B: ${{ inputs.skip-phase-b }}
        ENDPOINTS_FILTER: ${{ inputs.endpoints-filter }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ inputs.model }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        FAIL_ON: ${{ inputs.fail-on }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail
        args=(probe "$BASE_URL" --name "$PROBE_NAME" --report "$REPORT_PATH")
        if [ "$SKIP_PHASE_B" = "true" ]; then
          args+=(--skip-phase-b)
        fi
        if [ -n "$ENDPOINTS_FILTER" ]; then
          args+=(--endpoints-filter "$ENDPOINTS_FILTER")
        fi
        if [ "$PROFILE" != "openai" ]; then
          args+=(--profile "$PROFILE")
        fi
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        if [ -n "$OPENAI_API_KEY" ]; then
          args+=(--openai-api-key "$OPENAI_API_KEY")
        fi
        # We never want aioc itself to non-zero-exit here; the action
        # decides via fail-on after parsing the JSON report. This keeps
        # the report path and counts available even on failure.
        aioc "${args[@]}" || true
        python "$GITHUB_ACTION_PATH/scripts/postprocess.py" \
          --report "$REPORT_PATH" \
          --fail-on "$FAIL_ON" \
          --step-summary "$STEP_SUMMARY"

    - name: Upload report artifact
      id: upload
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: aioc-report-${{ steps.label.outputs.name }}
        path: ${{ inputs.report-path }}
        if-no-files-found: error
        retention-days: 30
